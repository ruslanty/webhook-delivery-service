image: dunglas/frankenphp:1.13.3-php8.5.12-trixie

services:
  - name: mariadb:13.0.2
    alias: database

variables:
  MARIADB_DATABASE: webhook
  MARIADB_USER: webhook
  MARIADB_PASSWORD: webhook
  MARIADB_ROOT_PASSWORD: root
  DB_HOST: database
  DB_DATABASE: webhook
  DB_USERNAME: webhook
  DB_PASSWORD: webhook

before_script:
  - apt-get update -qq && apt-get install -y -qq git unzip
  - install-php-extensions pdo_mysql
  - php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
  - php composer-setup.php --install-dir=/usr/local/bin --filename=composer --version=2.10.3
  - composer install --no-interaction --prefer-dist

test:
  script:
    - composer quality
