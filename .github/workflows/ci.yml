name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:13.0.2
        env:
          MARIADB_DATABASE: webhook
          MARIADB_USER: webhook
          MARIADB_PASSWORD: webhook
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_DATABASE: webhook
      DB_USERNAME: webhook
      DB_PASSWORD: webhook

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.5.12'
          extensions: curl, pdo_mysql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run project quality checks
        run: composer quality
